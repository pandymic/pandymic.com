var data = ["<img border=\"0\" src=\"pic01.jpg\" width=\"400\" height=\"266\"></p><p>The <b>main</b> volcanic feature in the photograph is a</p><p><blockquote>|A. fissure.<br>|B. caldera.<br>|C. shield cone.<br>|D. composite cone.</blockquote></p>|<hr width=\"400\" align=\"left\">\n", "Features associated with intrusive volcanism are</p><p><blockquote>|A. dikes and levees.<br>|B. batholiths and sills.<br>|C. cones and moraines.<br>|D. lava plateaus and synclines.</blockquote></p>|<hr width=\"400\" align=\"left\">\n", "<img border=\"0\" src=\"pic02.jpg\" width=\"400\" height=\"239\"></p><p>The diagram above illustrates a</p><p><blockquote>|A. horst.<br>|B. graben.<br>|C. volcanic plug.<br>|D. fold mountain.</blockquote></p>|<hr width=\"400\" align=\"left\">\n", "<img border=\"0\" src=\"pic03.jpg\" width=\"400\" height=\"318\"></p><p>Location <b>X</b> shown above is a(n)</p><p><blockquote>|A. fault.<br>|B. focus.<br>|C. geyser.<br>|D. epicentre.</blockquote></p>|<hr width=\"400\" align=\"left\">\n", "<img border=\"0\" src=\"pic04.jpg\" width=\"400\" height=\"265\"></p><p>In this photograph of the Canadian Rockies, the mountains were mainly formed by</p><p><blockquote>|A. tension.<br>|B. glaciation.<br>|C. volcanism.<br>|D. compression.</blockquote></p>|<hr width=\"400\" align=\"left\">\n", "<img border=\"0\" src=\"pic05.jpg\" width=\"400\" height=\"272\"></p><p>The break up and fragmentation of the rock in the photograph is <b>primarily</b>the result of</p><p><blockquote>|A. oxidation and hydrolysis.<br>|B. plant and animal activity.<br>|C. frost-shattering and gravity.<br>|D. volcanism and crystal growth.</blockquote></p>|<hr width=\"400\" align=\"left\">\n", "<img border=\"0\" src=\"pic06.jpg\" width=\"400\" height=\"312\"></p><p>The erosional processes that threaten the homes in the photograph are</p><p><blockquote>|A. attrition and deflation.<br>|B. corrosion and traction.<br>|C. corrasion and saltation.<br>|D. abrasion and hydraulic action.</blockquote></p>|<hr width=\"400\" align=\"left\">\n", "<img border=\"0\" src=\"pic07.jpg\" width=\"400\" height=\"141\"></p><p>The diagrams above illustrate the formation of a</p><p><blockquote>|A. crag and tail.<br>|B. truncated spur.<br>|C. pyramidal peak.<br>|D. roche moutonnee.</blockquote></p>|<hr width=\"400\" align=\"left\">\n", "<img border=\"0\" src=\"pic07.jpg\" width=\"400\" height=\"141\"></p><p>Which processes are responsible for the formation of the main features in the diagrams?</p><p><blockquote>|A. plucking and abrasion<br>|B. hydration and oxidation<br>|C. corrosion and hydraulic action<br>|D. thermal expansion and contraction</blockquote></p>|<hr width=\"400\" align=\"left\">\n", "Which of the following depositional features are the result of continental glaciation?</p><p><blockquote>|A. eskers, fiords and horns<br>|B. aretes, drumlins and tarns<br>|C. erratics, moraines and outwash plains<br>|D. cirques, kettle lakes and truncated spurs</blockquote></p>|<hr width=\"400\" align=\"left\">\n", "<img border=\"0\" src=\"pic08.jpg\" width=\"400\" height=\"136\"></p><p>The process illustrated by diagram <b>X</b> is found at which location on the map?</p><p><blockquote>|A. P<br>|B. S<br>|C. T<br>|D. U</blockquote></p>|<hr width=\"400\" align=\"left\">\n", "<img border=\"0\" src=\"pic08.jpg\" width=\"400\" height=\"136\"></p><p>Which location on the map is associated with steep-sloped volcanic cones consisting of multiple layers of ash and thick, andesitic lava?</p><p><blockquote>|A. Q<br>|B. R<br>|C. S<br>|D. T</blockquote></p>|<hr width=\"400\" align=\"left\">\n", "<img border=\"0\" src=\"pic08.jpg\" width=\"400\" height=\"136\"></p><p>The islands at location <b>U</b> on the map are the result of</p><p><blockquote>|A. diverging oceanic plates.<br>|B. a subducting oceanic plate.<br>|C. colliding continental plates.<br>|D. diverging continental plates.</blockquote></p>|<hr width=\"400\" align=\"left\">\n", "<img border=\"0\" src=\"pic09.jpg\" width=\"400\" height=\"216\"></p><p>The diagram above illustrates the formation of a(n)</p><p><blockquote>|A. tarn.<br>|B. atoll.<br>|C. caldera.<br>|D. batholith.</blockquote></p>|<hr width=\"400\" align=\"left\">\n", "When a block of the earth's crust slips between two normal fault lines, the resulting landform is a</p><p><blockquote>|A. rift valley.<br>|B. thrust fault.<br>|C. reverse fault.<br>|D. fold mountain.</blockquote></p>|<hr width=\"400\" align=\"left\">\n", "Which processes are responsible for the formation of a levee?</p><p><blockquote>|A. plucking and abrasion<br>|B. flooding and deposition<br>|C. isostatic uplift and rejuvenation<br>|D. thermal expansion and exfoliation</blockquote></p>|<hr width=\"400\" align=\"left\">\n", "<img border=\"0\" src=\"pic10.jpg\" width=\"300\" height=\"405\"></p><p>The formation of the glacial ice illustrated above is a result of</p><p><blockquote>|A. fluctuations in the earth's orbit.<br>|B. pressure and snowfall exceeding melting.<br>|C. excessive precipitation, and glacial retreat.<br>|D. compression and ablation exceeding snowfall.</blockquote></p>|<hr width=\"400\" align=\"left\">\n", "<img border=\"0\" src=\"pic11.jpg\" width=\"400\" height=\"260\"></p><p>Which pair of erosional features is associated with the landscape in the diagram above?</p><p><blockquote>|A. horns and sills<br>|B. levees and cirques<br>|C. hanging valleys and spits<br>|D. truncated spurs and aretes</blockquote></p>|<hr width=\"400\" align=\"left\">\n", "Large boulders transported and deposited by glaciers are called</p><p><blockquote>|A. kettles.<br>|B. erratics.<br>|C. drumlins.<br>|D. striations.</blockquote></p>|<hr width=\"400\" align=\"left\">\n", "Undercutting at the base of a coastal cliff is a result of</p><p><blockquote>|A. gravity and saltation.<br>|B. traction and solution.<br>|C. exfoliation and corrosion.<br>|D. abrasion and hydraulic action.</blockquote></p>|<hr width=\"400\" align=\"left\">\n", "Stalactites and stalagmites are the result of an interaction between the</p><p><blockquote>|A. biosphere, atmosphere and hydrosphere.<br>|B. atmosphere, hydrosphere and biosphere.<br>|C. lithosphere, atmosphere and hydrosphere.<br>|D. biosphere, asthenosphere and lithosphere.</blockquote></p>|<hr width=\"400\" align=\"left\">\n", "<img border=\"0\" src=\"pic12.jpg\" width=\"400\" height=\"227\"></p><p>The features in the photograph above have been shaped <b>mainly </b>by</p><p><blockquote>|A. ice.<br>|B. wind.<br>|C. water.<br>|D. waves.</blockquote></p>|<hr width=\"400\" align=\"left\">\n", "Seismologists are associated with the study of</p><p><blockquote>|A. severe storms.<br>|B. ocean currents.<br>|C. plate movement.<br>|D. rainforest destruction.</blockquote></p>|<hr width=\"400\" align=\"left\">\n", "<img border=\"0\" src=\"pic13.jpg\" width=\"400\" height=\"381\"></p><p>Most of the volcanoes shown on the map are</p><p><blockquote>|A. shield.<br>|B. cinder.<br>|C. fissure.<br>|D. composite.</blockquote></p>|<hr width=\"400\" align=\"left\">\n", "<img border=\"0\" src=\"pic13.jpg\" width=\"400\" height=\"381\"></p><p>A common geographic theme represented on the map is</p><p><blockquote>|A. region.<br>|B. movement.<br>|C. absolute location.<br>|D. human interaction.</blockquote></p>|<hr width=\"400\" align=\"left\">\n", "<img border=\"0\" src=\"pic13.jpg\" width=\"400\" height=\"381\"></p><img border=\"0\" src=\"pic14.jpg\" width=\"400\" height=\"350\"></p><p>Which of the diagrams best represents the type of plate boundary found at location <b>P</b> on the map?</p><p><blockquote>|A. W<br>|B. X<br>|C. Y<br>|D. Z</blockquote></p>|<hr width=\"400\" align=\"left\">\n", "<img border=\"0\" src=\"pic14.jpg\" width=\"400\" height=\"350\"></p><p>Which plate boundary diagram illustrates the process of rifting?</p><p><blockquote>|A. W<br>|B. X<br>|C. Y<br>|D. Z</blockquote></p>|<hr width=\"400\" align=\"left\">\n", "<img border=\"0\" src=\"pic15.jpg\" width=\"400\" height=\"218\"></p><p>Feature <b>X</b> in the diagram above is a</p><p><blockquote>|A. dike.<br>|B. batholith.<br>|C. lava plateau.<br>|D. sedimentary strata.</blockquote></p>|<hr width=\"400\" align=\"left\">\n", "<img border=\"0\" src=\"pic15.jpg\" width=\"400\" height=\"218\"></p><p>Which of the following processes created feature <b>X</b>?</p><p><blockquote>|A. compression<br>|B. isostatic uplift<br>|C. intrusion of magma<br>|D. explosive volcanic activity</blockquote></p>|<hr width=\"400\" align=\"left\">\n", "A scree slope consists of</p><p><blockquote>|A. glacial drift and till.<br>|B. a mixture of sand and clay.<br>|C. rounded gravels and alluvium.<br>|D. coarse, angular rock fragments.</blockquote></p>|<hr width=\"400\" align=\"left\">\n", "<img border=\"0\" src=\"pic16.jpg\" width=\"400\" height=\"264\"></p><p>The rock type in the photograph is</p><p><blockquote>|A. igneous.<br>|B. sedimentary.<br>|C. metamorphic.<br>|D. hydrothermal.</blockquote></p>|<hr width=\"400\" align=\"left\">\n", "<img border=\"0\" src=\"pic16.jpg\" width=\"400\" height=\"264\"></p><p>The erosional processes primarily responsible for shaping the coastal landscape inthe photograph are</p><p><blockquote>|A. plucking and deflation.<br>|B. saltation and corrasion.<br>|C. exfoliation and mass wasting.<br>|D. hydraulic action and abrasion.</blockquote></p>|<hr width=\"400\" align=\"left\">\n", "<img border=\"0\" src=\"pic17.jpg\" width=\"400\" height=\"243\"></p><p>A terminal moraine is located at</p><p><blockquote>|A. W.<br>|B. X.<br>|C. Y.<br>|D. Z.</blockquote></p>|<hr width=\"400\" align=\"left\">\n", "Aretes and cirques are a direct result of the interactions between the</p><p><blockquote>|A. lithosphere and biosphere.<br>|B. biosphere and atmosphere.<br>|C. hydrosphere and lithosphere.<br>|D. atmosphere and hydrosphere</blockquote></p>|<hr width=\"400\" align=\"left\">\n", "<img border=\"0\" src=\"pic18.jpg\" width=\"400\" height=\"326\"></p><p>What tectonic force is <b>directly </b>responsible for the formation of the landform in the photograph?</p><p><blockquote>|A. rifting<br>|B. tearing<br>|C. tension<br>|D. compression</blockquote></p>|<hr width=\"400\" align=\"left\">\n", "<img border=\"0\" src=\"pic18.jpg\" width=\"400\" height=\"326\"></p><p>The formation of the rocks in the photograph is the direct result of interactions between the</p><p><blockquote>|A. atmosphere and biosphere.<br>|B. atmosphere and lithosphere.<br>|C. hydrosphere and lithosphere.<br>|D. troposphere and hydrosphere.</blockquote></p>|<hr width=\"400\" align=\"left\">\n", "<img border=\"0\" src=\"pic19.jpg\" width=\"400\" height=\"83\"></p><p>The information above is associated with the</p><p><blockquote>|A. divergence of two plates.<br>|B. lateral movement of two plates.<br>|C. convergence of two oceanic plates.<br>|D. subduction of an oceanic plate under a continental plate.</blockquote></p>|<hr width=\"400\" align=\"left\">\n", "<img border=\"0\" src=\"pic20.jpg\" width=\"400\" height=\"375\"></p><p>At which location on the map above would both composite volcanoes and island arcs be found?</p><p><blockquote>|A. W<br>|B. X<br>|C. Y<br>|D. Z</blockquote></p>|<hr width=\"400\" align=\"left\">\n", "<img border=\"0\" src=\"pic20.jpg\" width=\"400\" height=\"375\"></p><p>A tectonic event at <b>Z </b>may result in damage and loss of life at <b>Y </b>due to</p><p><blockquote>|A. a tsunami.<br>|B. mud flows.<br>|C. liquefaction.<br>|D. an ash cloud.</blockquote></p>|<hr width=\"400\" align=\"left\">\n", "<img border=\"0\" src=\"pic21.jpg\" width=\"400\" height=\"173\"></p><p>Feature <b>X </b>in the diagrams above is a(n)</p><p><blockquote>|A. sill.<br>|B. rock pillar.<br>|C. crag and tail.<br>|D. exposed neck.</blockquote></p>|<hr width=\"400\" align=\"left\">\n", "<img border=\"0\" src=\"pic22.jpg\" width=\"400\" height=\"312\"></p><p>Feature <b>X </b>in the photograph is a(n)</p><p><blockquote>|A. alluvial fan.<br>|B. cuspate delta.<br>|C. slip-off slope.<br>|D. terminal moraine.</blockquote></p>|<hr width=\"400\" align=\"left\">\n", "<img border=\"0\" src=\"pic22.jpg\" width=\"400\" height=\"312\"></p><p>The formation of feature <b>X </b>is <b>mainly </b>the result of</p><p><blockquote>|A. abrasion and plucking.<br>|B. corrosion and deflation.<br>|C. soil creep and slumping.<br>|D. hydraulic action and deposition.</blockquote></p>|<hr width=\"400\" align=\"left\">\n", "<img border=\"0\" src=\"pic23.jpg\" width=\"400\" height=\"283\"></p><p>Glacial features visible in the photograph are</p><p><blockquote>|A. eskers and stacks.<br>|B. cirques and horns.<br>|C. erratics and grykes.<br>|D. drumlins and levees.</blockquote></p>|<hr width=\"400\" align=\"left\">\n", "Convection currents responsible for plate movement are found within the</p><p><blockquote>|A. crust.<br>|B. inner core.<br>|C. exosphere.<br>|D. asthenosphere.</blockquote></p>|<hr width=\"400\" align=\"left\">\n", "<img border=\"0\" src=\"pic24.jpg\" width=\"400\" height=\"375\"></p><p>The rock type found at <b>W </b>would be</p><p><blockquote>|A. igneous.<br>|B. sedimentary.<br>|C. metamorphic.<br>|D. hydrothermal.</blockquote></p>|<hr width=\"400\" align=\"left\">\n", "<img border=\"0\" src=\"pic25.jpg\" width=\"400\" height=\"244\"></p><p>The tectonic process and resulting features associated with location <b>X </b>on the map above are</p><p><blockquote>|A. subduction and rift valleys.<br>|B. faulting and fold mountains.<br>|C. divergence and shield volcanoes.<br>|D. convergence and composite cones.</blockquote></p>|<hr width=\"400\" align=\"left\">\n", "<img border=\"0\" src=\"pic25.jpg\" width=\"400\" height=\"244\"></p><p>The highest magnitude earthquakes have most frequently occurred at map location</p><p><blockquote>|A. W.<br>|B. X.<br>|C. Y.<br>|D. Z.</blockquote></p>|<hr width=\"400\" align=\"left\">\n", "<img border=\"0\" src=\"pic26.jpg\" width=\"415\" height=\"252\"></p><p>What type of volcano is illustrated in the photograph above?</p><p><blockquote>|A. dome<br>|B. shield<br>|C. cinder<br>|D. composite</blockquote></p>|<hr width=\"400\" align=\"left\">\n", "A solidified intrusion of magma found between layers of strata is called a</p><p><blockquote>|A. sill.<br>|B. dike.<br>|C. fissure.<br>|D. batholith.</blockquote></p>|<hr width=\"400\" align=\"left\">\n", "Anticlines and synclines are the result of</p><p><blockquote>|A. rifting.<br>|B. tension.<br>|C. faulting.<br>|D. compression.</blockquote></p>|<hr width=\"400\" align=\"left\">\n", "<img border=\"0\" src=\"pic27.jpg\" width=\"400\" height=\"240\"></p><p>The landform at <b>X </b>in the diagram above is a</p><p><blockquote>|A. horst.<br>|B. scarp.<br>|C. graben.<br>|D. geosyncline.</blockquote></p>|<hr width=\"400\" align=\"left\">\n", "<img border=\"0\" src=\"pic28.jpg\" width=\"400\" height=\"600\"></p><p>Which mechanical weathering process is illustrated in the diagram above?</p><p><blockquote>|A. plucking<br>|B. oxidation<br>|C. hydrolysis<br>|D. frost shattering</blockquote></p>|<hr width=\"400\" align=\"left\">\n", "<img border=\"0\" src=\"pic29.jpg\" width=\"400\" height=\"129\"></p><p>Referring to the diagrams above, human activity has increased the likelihood of what occurrence?</p><p><blockquote>|A. earthquakes<br>|B. mass wastage<br>|C. hydraulic action<br>|D. chemical weathering</blockquote></p>|<hr width=\"400\" align=\"left\">\n", "<img border=\"0\" src=\"pic30.jpg\" width=\"400\" height=\"132\"></p><p>Referring to the diagrams above, what feature will result when the glacial trough in diagram <b>R</b> is occupied by an arm of the sea as in diagram <b>S </b>?</p><p><blockquote>|A. ria<br>|B. fiord<br>|C. lagoon<br>|D. canyon</blockquote></p>|<hr width=\"400\" align=\"left\">\n", "<img border=\"0\" src=\"pic30.jpg\" width=\"400\" height=\"132\"></p><p>Feature <b>X </b>in diagram <b>S </b>is a(n)</p><p><blockquote>|A. arete.<br>|B. cirque.<br>|C. truncated spur.<br>|D. pyramidal peak.</blockquote></p>|<hr width=\"400\" align=\"left\">\n", "A transported rock geologically different from the bedrock on which it lies is a(n)</p><p><blockquote>|A. butte.<br>|B. stack.<br>|C. erratic.<br>|D. cap rock.</blockquote></p>|<hr width=\"400\" align=\"left\">\n", "<img border=\"0\" src=\"pic31.jpg\" width=\"400\" height=\"498\"></p><p>The stratification of rock shown in the photograph is associated with which rock classification?</p><p><blockquote>|A. magmatic<br>|B. sedimentary<br>|C. metamorphic<br>|D. extrusive igneous</blockquote></p>|<hr width=\"400\" align=\"left\">\n", "<img border=\"0\" src=\"pic31.jpg\" width=\"400\" height=\"498\"></p><p>The mountain in the photograph was formed <b>mainly </b>by</p><p><blockquote>|A. tension and isostasy.<br>|B. uplift and volcanism.<br>|C. weathering and upwelling.<br>|D. deposition and compression.</blockquote></p>|<hr width=\"400\" align=\"left\">\n", "<img border=\"0\" src=\"pic32.jpg\" width=\"415\" height=\"273\"></p><p>The movement of the Pacific Plate shown in the diagram above is due to the convectional currents within the</p><p><blockquote>|A. exosphere.<br>|B. hydrosphere.<br>|C. thermosphere.<br>|D. asthenosphere.</blockquote></p>|<hr width=\"400\" align=\"left\">\n", "<img border=\"0\" src=\"pic32.jpg\" width=\"415\" height=\"273\"></p><p>The Hawaiian Islands are the result of</p><p><blockquote>|A. subduction.<br>|B. hot-spot activity.<br>|C. plate divergence.<br>|D. plate convergence.</blockquote></p>|<hr width=\"400\" align=\"left\">\n", "Calderas and fissures are features associated with</p><p><blockquote>|A. glaciation.<br>|B. lithification.<br>|C. coastal erosion.<br>|D. volcanic activity.</blockquote></p>|<hr width=\"400\" align=\"left\">\n", "<img border=\"0\" src=\"pic33.jpg\" width=\"400\" height=\"174\"></p><p>Features <b>X </b>and <b>Y </b>in the diagram above are</p><p><blockquote>|A. horsts and grabens.<br>|B. sills and batholiths.<br>|C. anticlines and synclines.<br>|D. block and fold mountains.</blockquote></p>|<hr width=\"400\" align=\"left\">\n", "<img border=\"0\" src=\"pic34.jpg\" width=\"400\" height=\"285\"></p><p>Feature <b>X </b>in the diagram above is a(n)</p><p><blockquote>|A. focus.<br>|B. aquifer.<br>|C. syncline.<br>|D. epicentre.</blockquote></p>|<hr width=\"400\" align=\"left\">\n", "<img border=\"0\" src=\"pic34.jpg\" width=\"400\" height=\"285\"></p><p>The analysis and interpretation of the process shown in the diagram above would be conducted by a</p><p><blockquote>|A. seismologist.<br>|B. cartographer.<br>|C. climatologist.<br>|D. meteorologist.</blockquote></p>|<hr width=\"400\" align=\"left\">\n", "Stalactites and stalagmites are formed as a result of</p><p><blockquote>|A. ice wedging.<br>|B. wave erosion.<br>|C. river deposition.<br>|D. chemical weathering.</blockquote></p>|<hr width=\"400\" align=\"left\">\n", "<img border=\"0\" src=\"pic35.jpg\" width=\"400\" height=\"308\"></p><p>The feature labelled <b>X </b>in the photograph is a</p><p><blockquote>|A. fault.<br>|B. joint.<br>|C. fracture.<br>|D. striation.</blockquote></p>|<hr width=\"400\" align=\"left\">\n", "<img border=\"0\" src=\"pic35.jpg\" width=\"400\" height=\"308\"></p><p>Which process is primarily responsible for the formation of feature <b>X </b>in the photograph?</p><p><blockquote>|A. abrasion<br>|B. deflation<br>|C. corrosion<br>|D. hydraulic action</blockquote></p>|<hr width=\"400\" align=\"left\">\n"];
var key = ["d", "b", "a", "d", "d", "c", "d", "c", "a", "c", "b", "a", "b", "c", "a", "b", "b", "d", "b", "d", "c", "c", "c", "d", "a", "b", "c", "b", "c", "d", "b", "d", "c", "c", "d", "c", "a", "b", "a", "d", "a", "d", "b", "d", "c", "c", "d", "c", "a", "d", "c", "d", "b", "b", "c", "c", "b", "d", "d", "b", "d", "a", "a", "a", "d", "d", "a"];
var num_to_ask = Number(new URLSearchParams(location.search).get("q")) || 0, tmp = [], order = data.map(function (_, i) { return i; });
while (order.length) tmp.push(order.splice(Math.floor(Math.random() * order.length), 1)[0]);
var out = '<form name="quiz" onsubmit="return grade()">', asked = [];
for (var i = 0; i <= num_to_ask - 1 && i < tmp.length; i++) {
  var q_num = i + 1, f = data[tmp[i]].split("|"), q = f[0] || "";
  if (q !== "") { asked.push(tmp[i]);
    out += '<div id="qq' + i + '"><p><b>' + q_num + ".</b> " + q + "\n" +
    ["a", "b", "c", "d"].map(function (v, k) { return '<label id="q' + i + v + '"><input type="radio" name="q' + i + '" value="' + v + '">' + (f[k + 1] || "") + "</label>"; }).join("\n") +
    "\n</div>" + (f[5] || "") + "\n\n"; }
}
if (asked.length) out += '<p><input type="submit" value="Check Answers"> <span id="score" style="font-weight:bold"></span></p>';
document.write(out + "</form>");
function grade() {
  var right = 0;
  asked.forEach(function (n, i) {
    var pick = (document.querySelector('input[name="q' + i + '"]:checked') || {}).value, ans = key[n];
    ["a", "b", "c", "d"].forEach(function (v) { var l = document.getElementById("q" + i + v); if (l) { l.style.background = v === ans ? "#cfc" : (v === pick ? "#fcc" : ""); } });
    if (pick === ans) right++;
  });
  document.getElementById("score").innerHTML = right + " / " + asked.length + " correct (" + Math.round(100 * right / asked.length) + "%)" +
    ' <small style="font-weight:normal;color:#666">(answer key added in 2026; the 2002 CD had none)</small>';
  return false;
}
